<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnMotor hero video maker</title>
    <style>
      body { margin: 0; display: grid; min-height: 100vh; place-items: center; background: #09090b; color: #fff; font-family: Arial, sans-serif; }
      main { display: grid; gap: 18px; justify-items: center; padding: 24px; }
      canvas { width: min(960px, 92vw); height: auto; border-radius: 18px; box-shadow: 0 16px 60px #000; }
      button, a { border: 0; border-radius: 10px; background: #e60000; color: #fff; cursor: pointer; font: inherit; font-weight: 700; padding: 12px 18px; text-decoration: none; }
      a[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <p id="status">מוכן ליצירת הווידאו</p>
      <button id="make-video">יצירת וידאו</button>
      <a id="download" hidden>הורדת הווידאו</a>
    </main>
    <script>
      const scenePaths = [
        '/videos/onmotor-hero-road.png',
        '/videos/onmotor-hero-offroad.png',
        '/videos/onmotor-hero-city.png',
      ];
      const sceneDuration = 5000;
      const fadeDuration = 700;
      const totalDuration = sceneDuration * 3 - fadeDuration * 2;
      const canvas = document.querySelector('#canvas');
      const context = canvas.getContext('2d');
      const status = document.querySelector('#status');
      const makeButton = document.querySelector('#make-video');
      const download = document.querySelector('#download');

      const loadImage = (path) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = path;
      });

      function drawCover(image, progress) {
        const cover = Math.max(canvas.width / image.width, canvas.height / image.height);
        const zoom = 1 + progress * 0.07;
        const width = image.width * cover * zoom;
        const height = image.height * cover * zoom;
        const x = (canvas.width - width) / 2;
        const y = (canvas.height - height) / 2;
        context.drawImage(image, x, y, width, height);
      }

      function sceneStart(index) {
        return index * (sceneDuration - fadeDuration);
      }

      function draw(images, elapsed) {
        context.fillStyle = '#09090b';
        context.fillRect(0, 0, canvas.width, canvas.height);

        for (let index = 0; index < images.length; index += 1) {
          const start = sceneStart(index);
          const end = start + sceneDuration;
          if (elapsed < start || elapsed > end) continue;

          const progress = Math.min(1, Math.max(0, (elapsed - start) / sceneDuration));
          const alpha = index > 0 && elapsed < start + fadeDuration
            ? (elapsed - start) / fadeDuration
            : 1;
          context.save();
          context.globalAlpha = alpha;
          drawCover(images[index], progress);
          context.restore();
        }
      }

      makeButton.addEventListener('click', async () => {
        makeButton.disabled = true;
        makeButton.hidden = true;
        status.textContent = 'טוען את הסצנות…';

        try {
          const images = await Promise.all(scenePaths.map(loadImage));
          const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9'
            : 'video/webm';
          const chunks = [];
          const recorder = new MediaRecorder(canvas.captureStream(30), {
            mimeType,
            videoBitsPerSecond: 6_000_000,
          });

          recorder.addEventListener('dataavailable', (event) => {
            if (event.data.size) chunks.push(event.data);
          });
          recorder.addEventListener('stop', () => {
            const blob = new Blob(chunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            download.href = url;
            download.download = 'onmotor-riders-hero-ai.webm';
            download.hidden = false;
            fetch('/api/hero-video', { method: 'POST', body: blob })
              .then((response) => {
                if (!response.ok) throw new Error('שמירת הווידאו נכשלה');
                status.textContent = 'הווידאו נשמר בפרויקט ומוכן להורדה';
              })
              .catch((error) => {
                status.textContent = error.message;
              });
          });

          const startedAt = performance.now();
          const render = (now) => {
            const elapsed = now - startedAt;
            draw(images, Math.min(elapsed, totalDuration));
            if (elapsed < totalDuration) requestAnimationFrame(render);
          };

          recorder.start(1000);
          requestAnimationFrame(render);
          status.textContent = 'מייצר וידאו… כ-14 שניות';
          window.setTimeout(() => recorder.stop(), totalDuration + 150);
        } catch (error) {
          status.textContent = `יצירת הווידאו נכשלה: ${error.message}`;
          makeButton.hidden = false;
          makeButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
